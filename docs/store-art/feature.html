<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,800&family=Roboto+Flex:wght@400;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(120% 140% at 85% 30%,#1f5c66 0%,#16424A 45%,#0e2c31 100%);font-family:'Roboto Flex',sans-serif;color:#FBF6EA;position:relative}
.mark{position:absolute;left:66px;top:71px;width:47px;height:62px}
.word{position:absolute;left:129px;top:64px;font-family:Literata,serif;font-weight:800;font-size:58px;letter-spacing:-1px;color:#FBF6EA}
.tag{position:absolute;left:66px;top:170px;width:470px;font-family:Literata,serif;font-weight:600;font-size:40px;line-height:1.18;color:#F4C76B}
.sub{position:absolute;left:68px;top:330px;width:460px;font-size:20px;line-height:1.45;color:#cfe3e2}
.chips{position:absolute;left:68px;top:418px;display:flex;gap:10px}
.chip{border:1.5px solid #4f8a90;border-radius:999px;padding:7px 14px;font-size:15px;color:#e8f2f1}
/* folded phone showing a cover on its outer screen */
.phone{position:absolute;right:250px;top:46px;width:200px;height:410px;border-radius:30px;background:#0b1d20;box-shadow:0 24px 50px rgba(0,0,0,.45),inset 0 0 0 3px #2b4d52;transform:rotate(-6deg)}
.phone .screen{position:absolute;inset:9px;border-radius:23px;overflow:hidden;background:#7b2d26}
.cover{position:absolute;inset:0;background:linear-gradient(160deg,#c8432b 0%,#8f2a1d 100%)}
.cover h3{position:absolute;left:18px;right:18px;top:52px;margin:0;font-family:Literata,serif;font-weight:800;font-size:30px;line-height:1.05;color:#fff4e3}
.cover p{position:absolute;left:18px;bottom:44px;margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#ffd9c7}
.cover .sun{position:absolute;left:50%;top:205px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:#F4C76B;box-shadow:0 0 0 14px rgba(244,199,107,.25)}
.bar{position:absolute;left:14px;right:14px;bottom:18px;height:5px;border-radius:5px;background:rgba(255,255,255,.25)}
.bar i{display:block;width:62%;height:100%;border-radius:5px;background:#fff4e3}
/* unfolded reader behind it */
.open{position:absolute;right:36px;top:92px;width:330px;height:300px;border-radius:24px;background:#0b1d20;box-shadow:0 20px 40px rgba(0,0,0,.35),inset 0 0 0 3px #2b4d52;transform:rotate(5deg)}
.open .pg{position:absolute;top:10px;bottom:10px;width:150px;background:#FBF6EA;border-radius:16px;padding:22px 16px;box-sizing:border-box}
.open .l{left:10px;border-top-right-radius:4px;border-bottom-right-radius:4px}
.open .r{right:10px;border-top-left-radius:4px;border-bottom-left-radius:4px}
.ln{height:6px;border-radius:3px;background:#c9c1b2;margin:0 0 9px}
.ln.ink{background:#3a2f23}
.hl{background:rgba(244,199,107,.75)}
.cap{font-family:Literata,serif;font-weight:800;font-size:15px;color:#3a2f23;margin:0 0 12px}
</style>
<style>
/* ---- Localized variants. Everything below only applies with ?lang=… (strings in feature-strings.js,
   render with render-feature.sh); without it the page is the English graphic exactly as above. ---- */
html.l10n .chip,html.l10n .cover p,html.l10n .cap{white-space:nowrap}
html.l10n .tag,html.l10n .sub{text-wrap:pretty}
html.l10n .cap{display:flex;justify-content:flex-end}
html.l10n .chip{padding:7px calc(14em / 15)}
html.webfont .chip{line-height:1.17}
html[data-script=jpan] .chip{font-feature-settings:"palt"}
html.webfont .tag,html.webfont .cover h3,html.webfont .cap{font-family:var(--serif)}
html.webfont body{font-family:var(--sans)}
html.cjk .tag,html.cjk .sub,html.cjk .cover h3{word-break:keep-all;line-break:strict}
html.cjk .tag{line-height:1.3}
html.cjk .sub{line-height:1.6}
html.cjk .cover h3{line-height:1.25}
html.cjk .chip{font-family:'Roboto Flex',var(--sans)}
html.cjk .cover p{letter-spacing:1px}
html[data-script=arab] .tag{line-height:1.42}
html[data-script=arab] .sub{line-height:1.65}
html[data-script=arab] .cover h3{line-height:1.4}
html[data-script=arab] .cover p{letter-spacing:0}
html[data-script=arab] .cover h3,html[data-script=arab] .cap{font-weight:700}
html[data-script=deva] .tag{line-height:1.4}
html[data-script=deva] .sub{line-height:1.6}
html[data-script=deva] .cover h3{line-height:1.35}
html[data-script=deva] .cover p{letter-spacing:.5px}
/* right-to-left: the same composition mirrored (the logo mark itself is not flipped) */
html[dir=rtl] body{background:radial-gradient(120% 140% at 15% 30%,#1f5c66 0%,#16424A 45%,#0e2c31 100%)}
html[dir=rtl] .mark{left:auto;right:66px}
html[dir=rtl] .word{left:auto;right:129px}
html[dir=rtl] .tag{left:auto;right:66px}
html[dir=rtl] .sub,html[dir=rtl] .chips{left:auto;right:68px}
html[dir=rtl] .phone{right:auto;left:250px;transform:rotate(6deg)}
html[dir=rtl] .open{right:auto;left:36px;transform:rotate(-5deg)}
html[dir=rtl] .open .l{left:auto;right:10px;border-radius:16px 4px 4px 16px}
html[dir=rtl] .open .r{right:auto;left:10px;border-radius:4px 16px 16px 4px}
html[dir=rtl] .cover p{left:auto;right:18px}
</style></head><body>
<svg class="mark" viewBox="35 28.5 38 50"><path fill="#FBF6EA" d="M38,28.5H64.5A8.5,8.5 0 0 1 73,37V70A8.5,8.5 0 0 1 64.5,78.5H38Z"/><path fill="#D4972B" d="M38,28.5A3,3 0 0 1 41,31.5V75.5A3,3 0 0 1 38,78.5A3,3 0 0 1 35,75.5V31.5A3,3 0 0 1 38,28.5Z"/><path fill="#F4C76B" d="M49.5,30.9H64.5A6.1,6.1 0 0 1 70.6,37V70A6.1,6.1 0 0 1 64.5,76.1H49.5A6.1,6.1 0 0 1 43.4,70V37A6.1,6.1 0 0 1 49.5,30.9Z"/><path fill="#E0633F" d="M45.14,74.27A12,12 0 0 1 68.86,74.27A6.1,6.1 0 0 1 64.5,76.1H49.5A6.1,6.1 0 0 1 45.14,74.27Z"/></svg>
<div class="word">Jacket</div>
<div class="tag">Let your foldable wear the book you’re reading.</div>
<div class="sub">The cover of your book, full-bleed on the outer screen. A calm reader inside, with read-aloud, highlights and search.</div>
<div class="chips"><span class="chip">EPUB · PDF · Comics · Text</span><span class="chip">Free &amp; open source</span><span class="chip">No tracking</span></div>
<div class="open">
  <div class="pg l"><div class="cap">Chapter IV</div><div class="ln ink" style="width:95%"></div><div class="ln ink" style="width:88%"></div><div class="ln ink hl" style="width:92%"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:94%"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:60%"></div></div>
  <div class="pg r"><div class="ln" style="width:92%"></div><div class="ln" style="width:86%"></div><div class="ln" style="width:95%"></div><div class="ln" style="width:72%"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:83%"></div><div class="ln" style="width:94%"></div><div class="ln" style="width:65%"></div><div class="ln" style="width:89%"></div><div class="ln" style="width:78%"></div><div class="ln" style="width:50%"></div></div>
</div>
<div class="phone"><div class="screen"><div class="cover"><h3>The Long Way Home</h3><div class="sun"></div><p>A novel</p><div class="bar"><i></i></div></div></div></div>
<script src="feature-strings.js"></script>
<script>
// ?lang=<fastlane locale> renders that locale; ?check adds a JSON layout/font report (for --dump-dom).
(async function () {
  var q = new URLSearchParams(location.search), code = q.get('lang') || 'en-US';
  var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  var SCRIPTS = {   // Google Fonts per writing system; Latin and Cyrillic use the Literata/Roboto Flex above
    latn: null,
    arab: { css: 'family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400', serif: "'Noto Naskh Arabic'", sans: "'Noto Sans Arabic'" },
    deva: { css: 'family=Noto+Serif+Devanagari:wght@600;800&family=Noto+Sans+Devanagari:wght@400', serif: "'Noto Serif Devanagari'", sans: "'Noto Sans Devanagari'" },
    jpan: { css: 'family=Noto+Serif+JP:wght@600;800&family=Noto+Sans+JP:wght@400', serif: "'Noto Serif JP'", sans: "'Noto Sans JP'", cjk: true },
    kore: { css: 'family=Noto+Serif+KR:wght@600;800&family=Noto+Sans+KR:wght@400', serif: "'Noto Serif KR'", sans: "'Noto Sans KR'", cjk: true },
    hans: { css: 'family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400', serif: "'Noto Serif SC'", sans: "'Noto Sans SC'", cjk: true },
    hant: { css: 'family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400', serif: "'Noto Serif TC'", sans: "'Noto Sans TC'", cjk: true }
  };
  // The English layout these limits come from: tagline top 170, 3 lines of 40px x 1.18; subline top 330,
  // 3 lines of 20px x 1.45; chips top 418. The text column must stay clear of the phone.
  var TAG_TOP = 170, TAG_H = 3 * 40 * 1.18, SUB_TOP = 330, SUB_H = 3 * 20 * 1.45, CHIPS_TOP = 418, CHIPS_MAX_RIGHT = 565;
  var textEls = function () { return [$('.word'), $('.tag'), $('.sub')].concat($$('.chip'), [$('.cover h3'), $('.cover p'), $('.cap')]); };
  async function fontsSettled() {
    await Promise.all(textEls().map(function (el) { return document.fonts.load(getComputedStyle(el).font, el.textContent).catch(function () {}); }));
    await document.fonts.ready;
  }
  function html(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\|/g, '<wbr>'); }
  function px(el, p) { return parseFloat(getComputedStyle(el)[p]); }
  function shrink(el, ok, min) {   // step the font size down by 1px until ok() holds
    var s = px(el, 'fontSize');
    while (!ok() && s > min) { s -= 1; el.style.fontSize = s + 'px'; }
    return s;
  }
  var fits = function (el) { return el.scrollWidth <= el.clientWidth + 0.5; };
  var report = { lang: code, sizes: {}, notes: [] };

  if (code !== 'en-US') {
    var L = (window.FEATURE_LOCALES || {})[code];
    if (!L) { document.body.textContent = 'Unknown lang ' + code; return; }
    var S = SCRIPTS[L.script || 'latn'], root = document.documentElement;
    // the English chapter heading's width, so the translated one ends where "IV" ends
    await document.fonts.load('800 15px Literata', 'Chapter IV');
    var r = document.createRange(); r.selectNodeContents($('.cap')); var capW = r.getBoundingClientRect().width;
    root.lang = L.lang; root.dir = L.dir || 'ltr'; root.dataset.script = L.script || 'latn';
    root.classList.add('l10n');
    if (S) {
      root.classList.add('webfont'); if (S.cjk) root.classList.add('cjk');
      root.style.setProperty('--serif', S.serif + ', Literata, serif');
      root.style.setProperty('--sans', S.sans + ", 'Roboto Flex', sans-serif");
      var link = document.createElement('link'); link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?' + S.css + '&display=block';
      await new Promise(function (ok) { link.onload = link.onerror = ok; document.head.appendChild(link); });
    }
    $('.word').lang = 'en';
    $('.tag').innerHTML = html(L.tag);
    $('.sub').innerHTML = html(L.sub);
    $('.chips').innerHTML = L.chips.map(function (c) { return '<span class="chip">' + html(c) + '</span>'; }).join('');
    $('.cover h3').innerHTML = html(L.title);
    $('.cover p').textContent = L.novel;
    $('.cap').textContent = L.cap; $('.cap').style.width = capW + 'px';
    var size = L.size || {};
    if (size.tag) $('.tag').style.fontSize = size.tag + 'px';
    if (size.sub) $('.sub').style.fontSize = size.sub + 'px';
    if (size.chip) $$('.chip').forEach(function (c) { c.style.fontSize = size.chip + 'px'; });
    if (size.title) $('.cover h3').style.fontSize = size.title + 'px';
    await fontsSettled();

    // Fit: only ever shrink, and only what runs long.
    var tag = $('.tag'), sub = $('.sub'), h3 = $('.cover h3'), sun = $('.cover .sun'), nov = $('.cover p');
    report.sizes.tag = shrink(tag, function () { return tag.offsetHeight <= TAG_H + 0.5 && fits(tag); }, 28);
    report.sizes.sub = shrink(sub, function () {
      return Math.round(sub.offsetHeight / px(sub, 'lineHeight')) <= 3 && tag.offsetHeight + sub.offsetHeight <= TAG_H + SUB_H + 0.5 && fits(sub);
    }, 15);
    var chips = $('.chips'), rtl = root.dir === 'rtl';
    var chipsFit = function () { var b = chips.getBoundingClientRect(); return rtl ? b.left >= 1024 - CHIPS_MAX_RIGHT : b.right <= CHIPS_MAX_RIGHT; };
    var cs = px($('.chip'), 'fontSize');
    while (!chipsFit() && cs > 12) { cs -= 0.5; $$('.chip').forEach(function (c) { c.style.fontSize = cs + 'px'; }); }
    report.sizes.chip = cs;
    report.sizes.title = shrink(h3, function () { return h3.offsetTop + h3.offsetHeight <= sun.offsetTop - 20 && fits(h3); }, 20);
    report.sizes.novel = shrink(nov, function () { return nov.offsetLeft + nov.offsetWidth <= nov.parentNode.clientWidth - 18; }, 10);
    await fontsSettled();

    // Same rhythm as English: wordmark and chips stay put; space a shorter text block leaves is
    // shared equally by the three gaps (wordmark-tagline, tagline-subline, subline-chips).
    var spare = Math.max(0, TAG_H + SUB_H - tag.offsetHeight - sub.offsetHeight) / 3;
    tag.style.top = (TAG_TOP + spare) + 'px';
    sub.style.top = (TAG_TOP + spare + tag.offsetHeight + (SUB_TOP - TAG_TOP - TAG_H) + spare) + 'px';
  } else {
    await document.fonts.ready;
  }

  if (!q.has('check')) return;
  // ---- ?check: report which font draws every character, and the text geometry ----
  await fontsSettled();
  var faces = []; document.fonts.forEach(function (f) { faces.push(f); });
  function ranges(f) {
    return f.unicodeRange.split(',').map(function (u) {
      var m = u.trim().replace(/^U\+/i, '').split('-');
      if (m[0].indexOf('?') >= 0) return [parseInt(m[0].replace(/\?/g, '0'), 16), parseInt(m[0].replace(/\?/g, 'F'), 16)];
      return [parseInt(m[0], 16), parseInt(m[1] || m[0], 16)];
    });
  }
  function weightOk(f, w) { var a = f.weight.split(' ').map(Number); return a.length > 1 ? w >= a[0] && w <= a[1] : a[0] === w; }
  function covering(fam, cp, w) {   // CSS falls back to the nearest weight; flag that as a problem
    var fs = faces.filter(function (f) { return f.family.replace(/["']/g, '') === fam && ranges(f).some(function (r) { return cp >= r[0] && cp <= r[1]; }); });
    var exact = fs.filter(function (f) { return weightOk(f, w); });
    return exact.length ? exact : fs.map(function (f) { return { status: f.status, weight: f.weight, synth: true }; });
  }
  report.fonts = textEls().map(function (el) {
    var cs = getComputedStyle(el), w = Number(cs.fontWeight);
    var fams = cs.fontFamily.split(',').map(function (s) { return s.trim().replace(/["']/g, ''); });
    var used = {}, problems = [];
    Array.from(el.textContent).forEach(function (ch) {
      if (/\s/.test(ch)) return;
      var cp = ch.codePointAt(0), hit = null;
      for (var i = 0; i < fams.length && !hit; i++) {
        var fs = covering(fams[i], cp, w);
        if (fs.length) hit = (fs.some(function (f) { return f.status === 'loaded'; }) ? fams[i] : 'NOT LOADED ' + fams[i]) + (fs[0].synth ? ' (no ' + w + ' weight)' : '');
      }
      hit = hit || 'SYSTEM FALLBACK';
      used[hit] = (used[hit] || 0) + 1;
      if (!/^(Literata|Roboto Flex|Noto)/.test(hit) || / \(no /.test(hit)) problems.push(ch + ' U+' + cp.toString(16) + ' -> ' + hit);
    });
    return { el: el.className || el.tagName, weight: w, size: cs.fontSize, used: used, problems: problems };
  });
  // geometry: canvas margins for the text column, clearance from the (rotated) phone, cover fit
  function quad(el) {
    var m = new DOMMatrix(getComputedStyle(el).transform), x = el.offsetLeft, y = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
    var cx = x + w / 2, cy = y + h / 2;
    return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]].map(function (p) { var t = m.transformPoint(new DOMPoint(p[0] - cx, p[1] - cy)); return [t.x + cx, t.y + cy]; });
  }
  function edgeX(q, y, side) {   // x of the phone's near edge at height y
    var a = side === 'left' ? q[0] : q[1], b = side === 'left' ? q[3] : q[2];
    return a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]);
  }
  var pq = quad($('.phone')), rtl2 = document.documentElement.dir === 'rtl', geo = [];
  [$('.word'), $('.tag'), $('.sub')].concat($$('.chip')).forEach(function (el) {
    var rects = [];
    if (el.classList.contains('chip')) rects = [el.getBoundingClientRect()];
    else { var rg = document.createRange(); rg.selectNodeContents(el); rects = [].slice.call(rg.getClientRects()); }
    var b = { l: 1e9, t: 1e9, r: -1e9, b: -1e9 }, clear = 1e9;
    rects.forEach(function (rc) {
      if (!rc.width) return;
      b.l = Math.min(b.l, rc.left); b.t = Math.min(b.t, rc.top); b.r = Math.max(b.r, rc.right); b.b = Math.max(b.b, rc.bottom);
      [rc.top, rc.bottom].forEach(function (y) {
        clear = Math.min(clear, rtl2 ? rc.left - edgeX(pq, y, 'right') : edgeX(pq, y, 'left') - rc.right);
      });
    });
    var g = { el: el.className, left: Math.round(b.l), top: Math.round(b.t), right: Math.round(b.r), bottom: Math.round(b.b), phoneClearance: Math.round(clear), lines: el.classList.contains('chip') ? 1 : Math.round(el.offsetHeight / px(el, 'lineHeight')) };
    if (b.l < 48 || b.t < 48 || b.r > 976 || b.b > 452) report.notes.push('MARGIN ' + g.el);
    if (clear < 20) report.notes.push('PHONE ' + g.el + ' clearance ' + Math.round(clear));
    if (!fits(el)) report.notes.push('OVERFLOW ' + g.el);
    geo.push(g);
  });
  var h3b = $('.cover h3'), sunb = $('.cover .sun'), novb = $('.cover p');
  geo.push({ el: 'cover h3', lines: Math.round(h3b.offsetHeight / px(h3b, 'lineHeight')), bottom: h3b.offsetTop + h3b.offsetHeight, sunTop: sunb.offsetTop - 14, fits: fits(h3b) });
  geo.push({ el: 'cover p', right: novb.offsetLeft + novb.offsetWidth, max: novb.parentNode.clientWidth - 18 });
  if (h3b.offsetTop + h3b.offsetHeight > sunb.offsetTop - 14 || !fits(h3b)) report.notes.push('COVER TITLE');
  if (novb.offsetLeft + novb.offsetWidth > novb.parentNode.clientWidth - 18) report.notes.push('COVER NOVEL');
  report.geometry = geo;
  report.fonts.forEach(function (f) { if (f.problems.length) report.notes.push('FONT ' + f.el + ': ' + f.problems.slice(0, 5).join(', ')); });
  var out = document.createElement('script'); out.type = 'application/json'; out.id = 'report';
  out.textContent = JSON.stringify(report); document.body.appendChild(out);
})();
</script>
