name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The natural voices (about 130 MB) are downloaded by the build and checked against a
      # pinned checksum; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: .gradle/voices
          key: voices-${{ hashFiles('app/build.gradle.kts') }}
      - name: Test, build and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      # The shrunk (R8) release build, signed with CI's throwaway debug key: catches classes
      # R8 removes that are only reached by reflection.
      - name: Release build
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: jacket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
