[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Material 3 Expressive components (button groups, wavy progress, floating toolbars,
# loading indicators, shapes) ship in 1.5.x, ahead of the BOM's 1.4.x mapping.
material3 = "1.5.0-rc01"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
window = "1.5.1"
glance = "1.2.0"
palette = "1.1.0"
webkit = "1.18.0"
graphicsShapes = "1.1.0"
coroutines = "1.11.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
window = { group = "androidx.window", name = "window", version.ref = "window" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself; declaring KGP here only pins the Kotlin version it uses.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
