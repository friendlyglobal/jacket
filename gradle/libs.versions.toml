[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Material 3 Expressive components (button groups, wavy progress, floating toolbars,
# loading indicators, shapes) ship in 1.5.x, ahead of the BOM's 1.4.x mapping.
material3 = "1.5.0-rc01"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
window = "1.5.1"
glance = "1.2.0"
palette = "1.1.0"
webkit = "1.18.0"
graphicsShapes = "1.1.0"
coroutines = "1.11.0"
junit = "4.13.2"
# EPUB rendering, pagination and read-aloud: https://github.com/readium/kotlin-toolkit (BSD-3-Clause)
readium = "3.4.0"
fragmentCompose = "1.9.1"
appcompat = "1.8.0"
desugarJdkLibs = "2.1.5"
# Same Media3 as Readium's TTS uses: lock-screen and headphone controls for read-aloud.
media3 = "1.11.0"
# Unit tests run on the JVM, where Android's org.json is only a stub.
orgJson = "20240303"
# Natural voices: on-device text-to-speech, https://github.com/k2-fsa/sherpa-onnx (Apache-2.0).
# 2.x has no GPL parts (espeak-ng was removed). The checksum of the release asset is pinned in
# app/build.gradle.kts; change both together.
sherpaOnnx = "2.0.1"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
window = { group = "androidx.window", name = "window", version.ref = "window" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
readium-shared = { group = "org.readium.kotlin-toolkit", name = "readium-shared", version.ref = "readium" }
readium-streamer = { group = "org.readium.kotlin-toolkit", name = "readium-streamer", version.ref = "readium" }
readium-navigator = { group = "org.readium.kotlin-toolkit", name = "readium-navigator", version.ref = "readium" }
readium-tts = { group = "org.readium.kotlin-toolkit", name = "readium-navigator-media-tts", version.ref = "readium" }
fragment-compose = { group = "androidx.fragment", name = "fragment-compose", version.ref = "fragmentCompose" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
sherpa-onnx = { group = "com.k2fsa.sherpa.onnx", name = "sherpa-onnx-static-link-onnxruntime", version.ref = "sherpaOnnx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself; declaring KGP here only pins the Kotlin version it uses.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
